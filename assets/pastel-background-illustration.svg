<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" fill="none">
  <style>
    .cloud-drift {
      transform-box: fill-box;
      transform-origin: center;
      animation: cloud-drift 18s ease-in-out infinite alternate;
      will-change: transform;
    }
    .cloud-drift-slow {
      animation-duration: 23s;
      animation-delay: -11s;
    }
    .cloud-drift-fast {
      animation-duration: 14s;
      animation-delay: -5s;
    }
    @keyframes cloud-drift {
      from { transform: translateX(-82px); }
      to { transform: translateX(82px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud-drift { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="sky" x1="720" y1="0" x2="720" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDF0FF"/>
      <stop offset=".52" stop-color="#EEE9FF"/>
      <stop offset="1" stop-color="#FFE7F1"/>
    </linearGradient>
    <linearGradient id="cloudTop" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".48" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#DCEBFA"/>
    </linearGradient>
    <linearGradient id="cloudPink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF8FC"/>
      <stop offset=".62" stop-color="#F8E8F4"/>
      <stop offset="1" stop-color="#E8D8F2"/>
    </linearGradient>
    <linearGradient id="blueWall" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FCFF"/>
      <stop offset=".55" stop-color="#D9ECFF"/>
      <stop offset="1" stop-color="#AFC9EC"/>
    </linearGradient>
    <linearGradient id="pinkWall" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF8FC"/>
      <stop offset=".58" stop-color="#F5DDEA"/>
      <stop offset="1" stop-color="#DDB9DA"/>
    </linearGradient>
    <linearGradient id="blueDome" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D5EEFF"/>
      <stop offset=".46" stop-color="#91C7EF"/>
      <stop offset="1" stop-color="#668FCB"/>
    </linearGradient>
    <linearGradient id="pinkDome" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE2F0"/>
      <stop offset=".5" stop-color="#F1B5D5"/>
      <stop offset="1" stop-color="#C988C5"/>
    </linearGradient>
    <linearGradient id="windowGlass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF8DF"/>
      <stop offset=".52" stop-color="#F4D398"/>
      <stop offset="1" stop-color="#E6AD80"/>
    </linearGradient>
    <filter id="cloudShadow" x="-35%" y="-50%" width="170%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="12"/>
      <feColorMatrix values="0 0 0 0 .36 0 0 0 0 .47 0 0 0 0 .66 0 0 0 .2 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <pattern id="domeTiles" width="32" height="28" patternUnits="userSpaceOnUse">
