<!DOCTYPE html>

<body>

<header>
 <b>

 </b>
 <span>
  Ustadzah

</header>
<nav>
 <button class="">
  Dashboard
 </button>
 <button class="">
  Murid
 </button>
 <button class="">
  Absensi
 </button>
 <button class="">
  Capaian
 </button>
 <button class="">

 </button>
 <button class="on">

 </button>
 <button class="">

 </button>
 <button class="">

 </button>

</nav>
<main>
 <form class="c">
  <h3>
   Tambah materi
  </h3>
  <div class="r">
   <div>
    <label>
     Judul
    </label>
    <input name="j" required value>
   </div>
   <div>
    <label>
     Mata pelajaran
    </label>
    <select name="mp">
     <option>
      Iqra&rsquo;/Ummi
     </option>
     <option>
      Berhitung
     </option>
     <option>
      Menulis
     </option>
     <option>
      Al-Qur&rsquo;an
     </option>
    </select>
   </div>
   <div>
    <label>
     Kelas
    </label>
    <select name="k">
     <option>
      sore
     </option>
     <option>
      malam
     </option>
    </select>
   </div>
  </div>
  <label>
   Isi materi
  </label>
  <textarea name="i" required style="width:100%"></textarea>
  <p>
   <button class="p">
    Simpan materi
   </button>
  </p>
 </form>
 <div class="c">
  <p>
   <b>
    Mengenal huruf Alif sampai Tsa
   </b>
   <span class="tag">
    Iqra&rsquo;/Ummi
   </span>
   <span class="tag">
    Kelas Sore
   </span>
   <br>
   Ulangi membaca Alif, Ba, Ta, Tsa bersama anak 5 menit setiap hari.
   <br>
   <button>
    Ubah
   </button>
   <button>
    Hapus
   </button>
  </p>
  <p>
   <b>
    Berhitung 1 sampai 10
   </b>
   <span class="tag">
    Berhitung
   </span>
   <span class="tag">
    Kelas Sore
   </span>
   <br>
   Minta anak menghitung benda di rumah, lalu menulis angkanya.
   <br>
   <button>
    Ubah
   </button>
   <button>
    Hapus
   </button>
  </p>
 </div>
</main>

</div>
